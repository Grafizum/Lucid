# lucid.grafizum.com deploys from main: a push to main uploads ./site to the
# lucid-legal Worker. Nothing else is uploaded — only ./site is served.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   scoped to this account, permission "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  3212d3605683b29e0f8f18635c210ee7
#
# Without them the run fails on purpose: a green run that deployed nothing
# would be worse than a red one.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare credentials
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions, then re-run this job."
            exit 1
          fi

      - name: Deploy ./site to the lucid-legal Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.168.0"
          command: deploy

      - name: Check the live page
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/privacy.html -w '%{http_code}' https://lucid.grafizum.com/privacy || true)
            if [ "$code" = "200" ] && grep -q 'Grafizum' /tmp/privacy.html; then
              echo "https://lucid.grafizum.com/privacy is serving."
              exit 0
            fi
            echo "attempt $attempt: got ${code:-no response}, retrying"
            sleep 10
          done
          echo "::error::https://lucid.grafizum.com/privacy did not come back healthy after the deploy."
          exit 1
