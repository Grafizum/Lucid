org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# What the next signed release is: fix, feature or breaking. A release build
# moves VERSION_NAME by that step (1.0.1 -> 1.0.2 | 1.1.1 | 2.0.0) before it
# builds, so "Generate Signed App Bundle" in Android Studio ships the right
# number without any command line. Commented out, the step is worked out from
# the commits since the last bump. Same as -Plucid.releaseType=...
#lucid.releaseType=feature
